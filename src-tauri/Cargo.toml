[package]
name = "remotier"
version = "0.1.0-beta2"
description = "Local-first SSH client"
authors = ["Eric Jaquome", "Lucas Regh"]
license = "copyright"
repository = ""
edition = "2021"
# Raised from 1.82 by remotier-sync-proto: edition 2024 is in that dependency graph and
# parsing those manifests needs Cargo 1.85.
rust-version = "1.85"

[lib]
name = "remotier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"

# `ring` instead of the default `aws-lc-rs`: aws-lc-rs needs CMake + NASM on Windows,
# which would break the cross-platform build story for no benefit here.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }

rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = { version = "1", features = ["derive"] }
# CTAP2 over USB HID, for FIDO/`sk-` keys. Its only C dependency is hidapi, which
# vendors its source and builds with `cc` - no CMake, no NASM, no OpenSSL.
ctap-hid-fido2 = "3"
sha2 = "0.10"

# The wire format and envelope crypto, shared with the sync server so there is one
# definition of what travels between them.
#
# A git dependency, not crates.io: this crate is an implementation detail of two
# applications and nothing else should depend on it, so a registry buys nothing and
# publishing it would invite exactly that.
#
# Pinned by `rev` rather than `branch`. Cargo.lock would pin a branch to a commit anyway,
# but a rev says which commit is intended rather than recording whichever one happened to
# be at the head of `main` the day the lock was written. Move it to `tag` once the sync
# repo starts tagging releases.
#
# Hosted on GitHub, not crates.io, and fetched anonymously - see `.cargo/config.toml`
# at the repository root for why cargo is told to fetch it with the git CLI.
remotier-sync-proto = { git = "https://github.com/cybrcr1me/remotier-sync", rev = "a95a502306e9ba3d60edd4aeb806f5fb08efe4df" }

# `rustls` on `ring`, explicitly. reqwest's plain `rustls-tls` feature pulls rustls's
# default provider, which is aws-lc-rs - CMake and NASM on Windows, the same reason
# russh above is pinned to ring. The provider is installed in `sync::client`.
reqwest = { version = "0.12", default-features = false, features = [
    "json", "http2", "charset", "rustls-tls-webpki-roots-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "7"
base64 = "0.23"
hex = "0.4"
log = "0.4"
rand = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[[example]]
name = "seed_dev"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
