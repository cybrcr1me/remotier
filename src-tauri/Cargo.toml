[package]
name = "remotier"
version = "0.1.0"
description = "Local-first SSH client"
authors = ["Flexusma"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.82"

[lib]
name = "remotier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"

# `ring` instead of the default `aws-lc-rs`: aws-lc-rs needs CMake + NASM on Windows,
# which would break the cross-platform build story for no benefit here.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }

rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = { version = "1", features = ["derive"] }
# CTAP2 over USB HID, for FIDO/`sk-` keys. Its only C dependency is hidapi, which
# vendors its source and builds with `cc` - no CMake, no NASM, no OpenSSL.
ctap-hid-fido2 = "3"
sha2 = "0.10"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "7"
base64 = "0.23"
hex = "0.4"
log = "0.4"
rand = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[[example]]
name = "seed_dev"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
