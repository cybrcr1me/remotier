<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b31"/>
      <stop offset="1" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle body, sized to macOS icon proportions. -->
  <rect x="96" y="96" width="832" height="832" rx="196" fill="url(#bg)"/>
  <rect x="96" y="96" width="832" height="832" rx="196" fill="url(#edge)"/>
  <rect x="98.5" y="98.5" width="827" height="827" rx="193.5"
        fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="5"/>

  <!-- Shell prompt: chevron and caret, the one thing every terminal shows. -->
  <g fill="none" stroke="#7dd3a0" stroke-width="52"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 396 L456 512 L332 628"/>
  </g>
  <rect x="530" y="602" width="190" height="52" rx="26" fill="#e7ecef"/>
</svg>
