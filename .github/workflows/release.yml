name: release

on:
  push:
    tags: ['v*']
  # Lets a release be built without tagging, e.g. to check the bundles still produce.
  workflow_dispatch:

# The download links on the website are version-free
# (/releases/latest/download/Remotier.dmg), which GitHub resolves by *filename*, not by
# version. So every release has to publish these exact names, and Tauri's own output -
# Remotier_0.1.0-beta2_amd64.AppImage - cannot be uploaded as it stands.
#
# The `.sig` files beside two of them are the in-app updater's signatures, and
# `latest.json` is the manifest every installed copy polls. Both halves of the release
# write that file, so it is merged rather than replaced - see scripts/updater-manifest.mjs.
env:
  LINUX_APPIMAGE: Remotier.AppImage
  LINUX_DEB: Remotier.deb
  WINDOWS_SETUP: Remotier-setup.exe

jobs:
  # Fails the release before an hour of build time, not after: a tag whose version does
  # not match the three manifests produces installers that lie about what they are.
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Versions agree with the tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            scripts/check-version.sh "${{ github.ref_name }}"
          else
            scripts/check-version.sh
          fi

  # Created here rather than by the build jobs, which would race each other to create the
  # same release and would leave the macOS build with nothing to upload into until one of
  # them finished.
  draft:
    needs: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release; leaving it alone"
            exit 0
          fi
          # Draft on purpose: macOS is built by hand (`bun run build:mac`) because GitHub
          # bills macOS runners at ten times the Linux rate, and publishing before that
          # lands would ship a version with no Mac download.
          printf '%s\n\n%s\n' \
            'See the assets below to download and install this version.' \
            'The macOS build is signed on a developer machine and uploaded to this draft before it is published.' \
            > notes.md
          gh release create "$TAG" --draft --title "Remotier $TAG" --notes-file notes.md

  build:
    needs: [version, draft]
    # `always()` because `draft` is skipped on a manual run, which would otherwise skip
    # this too - and a manual run exists precisely to check that the bundles still build.
    if: always() && needs.version.result == 'success'
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: Linux
          - platform: windows-latest
            name: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libudev-dev is for hidapi, which ctap-hid-fido2 builds to talk to a security
          # key - a dependency of the crate graph rather than of Tauri, which is why it
          # is in no Tauri setup snippet.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Before the build, not after: a missing updater key otherwise stops the bundler
      # once the app has already been compiled, twenty minutes in.
      - name: The updater is configured and has a key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: scripts/check-updater.sh

      # Builds only. The release is created above and the assets are attached below,
      # because this action uploads Tauri's version-stamped filenames and the download
      # links need stable ones.
      #
      # The extra config turns on `createUpdaterArtifacts`, which is not in the main one:
      # with it there, an ordinary unsigned `bun run tauri build` on a developer machine
      # would fail for want of a private key.
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --config src-tauri/tauri.updater.conf.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update payload - unrelated to code signing, and the only key that
          # matters to an already-installed copy deciding whether to trust a download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows signing is not configured. Until it is, SmartScreen warns until the
          # binary builds reputation; see docs/RELEASING.md.

      - name: Collect the bundles under their published names
        shell: bash
        run: |
          set -euo pipefail
          # Without this a glob that matches nothing expands to itself, so the count
          # below sees one "file" and the failure surfaces as a confusing cp error.
          shopt -s nullglob
          mkdir -p upload
          bundle=src-tauri/target/release/bundle

          # A glob that matched nothing, or matched twice, has to fail here rather than
          # silently publish one asset short: the website links to these names directly.
          copy_one() {
            local pattern="$1" dest="$2"
            # shellcheck disable=SC2206
            local matches=($pattern)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "expected exactly one file matching $pattern, found ${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "upload/$dest"
          }

          # The AppImage and the NSIS installer are also what the updater downloads, so
          # their signatures travel with them. The signature covers the bytes, not the
          # name, so renaming the bundle does not invalidate it.
          case "${{ runner.os }}" in
            Linux)
              copy_one "$bundle/appimage/*.AppImage" "$LINUX_APPIMAGE"
              copy_one "$bundle/appimage/*.AppImage.sig" "$LINUX_APPIMAGE.sig"
              copy_one "$bundle/deb/*.deb" "$LINUX_DEB"
              ;;
            Windows)
              copy_one "$bundle/nsis/*-setup.exe" "$WINDOWS_SETUP"
              copy_one "$bundle/nsis/*-setup.exe.sig" "$WINDOWS_SETUP.sig"
              ;;
          esac

          ls -l upload

      - name: Attach them to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # --clobber so re-running the workflow replaces the asset instead of failing on
        # the name, which is the whole point of the names being stable.
        run: gh release upload "$TAG" upload/* --clobber

  # A job of its own because both build jobs would otherwise race to write the same
  # manifest, and whichever finished second would drop the other's platform.
  manifest:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Merge Windows and Linux into latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)

          # Not tolerant of a missing signature: a manifest published without one leaves
          # that platform checking for updates and never being offered any.
          gh release download "$TAG" --dir "$work" \
            --pattern "$LINUX_APPIMAGE.sig" --pattern "$WINDOWS_SETUP.sig"

          # The macOS half of the release may already have written its entries, if it was
          # built first. Merged rather than replaced so whichever runs second keeps both.
          gh release download "$TAG" --dir "$work" --pattern latest.json || true

          node scripts/updater-manifest.mjs \
            --version "$(node -p "require('./package.json').version")" \
            --tag "$TAG" \
            --merge "$work/latest.json" \
            --out "$work/merged.json" \
            --entry "linux-x86_64,$LINUX_APPIMAGE,$work/$LINUX_APPIMAGE.sig" \
            --entry "windows-x86_64,$WINDOWS_SETUP,$work/$WINDOWS_SETUP.sig"

          mv "$work/merged.json" "$work/latest.json"
          cat "$work/latest.json"
          gh release upload "$TAG" "$work/latest.json" --clobber
